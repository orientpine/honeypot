[pytest]
# Pytest configuration for honeypot project

# Test discovery paths
testpaths =
    plugins/hwpx-generator/skills/hwpx-core/tests
    plugins/wiki-gen/skills/wiki-gen/tests

# Minimum Python version
minversion = 7.0

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers

# Markers for test categorization
markers =
    smoke: Smoke tests for data existence
    unit: Unit tests for individual functions
    integration: Integration tests
    slow: Slow running tests
